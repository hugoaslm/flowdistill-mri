experiment: smoke_ci
seed: 42
device: cpu
output_root: outputs
data:
  kind: synthetic
  samples: 16
  resolution: 32
  acceleration: 4
  center_fraction: 0.125
model:
  base_channels: 8
  channel_multipliers: [1, 2]
  residual_blocks: 1
  time_dim: 32
training:
  batch_size: 2
  teacher_steps: 4
  distillation_steps: 4
  learning_rate: 0.001
  ema_decay: 0.99
distillation:
  intervals: 4
  prediction_probability: 0.75
  correction_weight: 0.3
  correction_delay: 0.1
  correction_warmup: 0.1
  norm_exponent: 1.0
sampling:
  teacher_steps: 4
  solver: heun
track_b:
  enabled: false

